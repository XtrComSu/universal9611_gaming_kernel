# Gaming + KernelSU-Next + SUSFS fragment for exynos9611-m31 (4.14.357)
# Applied on top of arch/arm64/configs/exynos9611-m31_defconfig via merge_config.sh
# Conservative: enables perf features, does NOT disable Samsung-critical drivers.

# --- KernelSU-Next (legacy manual hooks) ---
CONFIG_KSU=y
# kprobe fallback (enable so both manual + kprobe work; manual preferred on 4.14 Samsung)
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_KSU_KPROBE_HOOKS=n

# --- SUSFS (requires KSU patch first, see integrate-ksu-susfs.sh) ---
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_HAS_MAGIC_TRICK=y
CONFIG_KSU_SUSFS_SUS_PATH=y
# SUS_MOUNT re-enabled: namespace fix now preserves all hunks (see workflow)
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_SU=n
# keep log OFF for gaming perf (enable for debugging: =y)
CONFIG_KSU_SUSFS_ENABLE_LOG=n

# --- CPU / GPU governors (gaming) ---
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_INTERACTIVE=y
CONFIG_DEVFREQ_GOV_PERFORMANCE=y
CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y
CONFIG_DEVFREQ_GOV_USERSPACE=y

# --- Scheduler / latency ---
CONFIG_PREEMPT=y
CONFIG_SCHED_AUTOGROUP=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_RT_GROUP_SCHED=y
CONFIG_SCHED_HRTICK=y

# --- Network gaming (low latency, BBR + fq_codel) ---
CONFIG_TCP_CONG_BBR=y
CONFIG_TCP_CONG_WESTWOOD=y
CONFIG_TCP_CONG_CUBIC=y
CONFIG_DEFAULT_TCP_CONG="bbr"
CONFIG_NET_SCH_FQ=y
CONFIG_NET_SCH_FQ_CODEL=y
CONFIG_NET_SCH_FQ_PIE=y
CONFIG_WIREGUARD=y

# --- Memory / ZRAM (smooth multitask while gaming) ---
CONFIG_ZRAM=y
CONFIG_ZRAM_DEF_COMP_LZ4=y
CONFIG_ZSMALLOC=y
CONFIG_ZSMALLOC_STAT=y
CONFIG_KSM=y
CONFIG_COMPACTION=y
CONFIG_COMPACT_UNEVEN=n
# THP breaks Samsung 4.14 khugepaged (no nr_ptes) - keep stock disabled

# --- FS (fast load) ---
CONFIG_F2FS_FS_COMPRESSION=y
CONFIG_F2FS_FS_LZ4=y
CONFIG_F2FS_FS_LZORLE=y
CONFIG_F2FS_FS_ZSTD=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y

# --- Misc gaming ---
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_PM_WAKELOCKS=y
CONFIG_PM_WAKELOCKS_LIMIT=0
CONFIG_PM_WAKELOCKS_GC=y
CONFIG_VT=n
CONFIG_LCD_CLASS_DEVICE=y

# --- XT-Everest branding ---
CONFIG_LOCALVERSION="-XT-Everest"
CONFIG_LOCALVERSION_AUTO=n

# --- USB WiFi adapters (OTG, as modules to keep boot safe) ---
CONFIG_WIRELESS=y
CONFIG_WLAN=y
CONFIG_MAC80211=m
CONFIG_MAC80211_HAS_RC=y
CONFIG_MAC80211_RC_MINSTREL=y
CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
CONFIG_MAC80211_MESH=y
CONFIG_MAC80211_LEDS=y
CONFIG_RTL8XXXU=m
CONFIG_RTL8XXXU_UNTESTED=y
CONFIG_RTLWIFI=m
CONFIG_RTLWIFI_USB=m
CONFIG_RTL8192CU=m
CONFIG_MT76=m
CONFIG_MT76_USB=m
CONFIG_MT76x0U=m
CONFIG_MT76x2U=m
CONFIG_ATH9K_HTC=m
CONFIG_CARL9170=m
CONFIG_RT2X00=m
CONFIG_RT2800USB=m
CONFIG_USB_NET_RNDIS_WLAN=m
CONFIG_USB_WDM=y
CONFIG_USB_USBNET=m

# --- Strip heavy debug for fps (safe only) ---
CONFIG_DEBUG_INFO=n
CONFIG_DEBUG_INFO_REDUCED=n
CONFIG_DEBUG_INFO_SPLIT=n
CONFIG_GDB_SCRIPTS=n
CONFIG_DEBUG_KERNEL=n
CONFIG_DEBUG_PREEMPT=n
CONFIG_LOCKUP_DETECTOR=n
CONFIG_DETECT_HUNG_TASK=n
CONFIG_SCHED_DEBUG=n
# FTRACE must stay on: Samsung decon driver uses trace_puts
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=n
CONFIG_STACK_TRACER=n
CONFIG_CORESIGHT=n
CONFIG_DEBUG_FS=n
# keep printk but quiet
CONFIG_CONSOLE_LOGLEVEL_DEFAULT=4
CONFIG_MESSAGE_LOGLEVEL_DEFAULT=4
