name: Build m31 Gaming KSU-SUSFS

on:
  workflow_dispatch:
  push:
    paths:
      - gaming.cfg
      - integrate-ksu-susfs.sh
      - .github/workflows/build-m31-gaming.yml

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git curl wget python3 python3-pip bc bison flex \
            build-essential clang llvm lld libssl-dev libelf-dev libncurses-dev \
            dwarves cpio rsync unzip zip binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler \
            ccache u-boot-tools

      - name: Clone kernel (shallow, lineage-24.0)
        run: |
          git clone --depth 1 --branch lineage-24.0 https://github.com/Parbindar7/android_kernel_samsung_universal9611 kernel
          git -C kernel rev-parse --short HEAD
          git -C kernel ls-tree --name-only HEAD:arch/arm64/configs | grep 9611

      - name: Toolchain (Proton Clang 13)
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang /tmp/proton
          mkdir -p kernel/toolchain
          cp -a /tmp/proton/bin kernel/toolchain/
          cp -a /tmp/proton/lib kernel/toolchain/ 2>/dev/null || true
          cp -a /tmp/proton/include kernel/toolchain/ 2>/dev/null || true
          kernel/toolchain/bin/clang --version | head -n1

      - name: Integrate KernelSU-Next v3.2 + SUSFS minimal
        working-directory: kernel
        run: |
          # KSUN v3.2 (Next) - requires new layout (drivers/kernelsu symlink), not legacy KernelSU/kernel
          # Use Next's setup.sh with v3.2.0 tag
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.2.0
          ls KernelSU-Next/kernel/Kbuild || ls KernelSU-Next/kernel/Makefile
          ls -l drivers/kernelsu || true
          # SUSFS minimal (no namespace) for Samsung 4.14 - per SUSFS-SAMSUNG-GUIDE.md §4
          # KSUN v3.2 needs next-susfs variant? We'll try standard kernel-4.14 patch and handle mismatches
          rm -rf /tmp/susfs4ksu
          git clone --depth 1 --branch kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          git -C /tmp/susfs4ksu rev-parse --short HEAD
          # Try Next-compatible patch first, fallback to standard
          if [ -f /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]; then
            cp -v /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/ || cp -v /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./ 
          fi
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/ || true
          mkdir -p include/linux
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ || true
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || cp -v /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/ || true
          SUSFS_PATCH=$(ls /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel*4.14*.patch 2>/dev/null | head -n1 || echo "")
          echo "SUSFS_PATCH=$SUSFS_PATCH"
          cp -v "$SUSFS_PATCH" ./50_susfs.patch || true
          # Try patching KSUN - handle both Next layout and legacy fallback
          if [ -d KernelSU-Next ]; then
            cd KernelSU-Next; patch -p1 --fuzz=3 < 10_enable_susfs_for_ksu.patch || echo "KSUN patch had fuzz/rejects, check manually"; cd ..
          elif [ -d KernelSU ]; then
            cd KernelSU; patch -p1 --fuzz=3 < 10_enable_susfs_for_ksu.patch || true; cd ..
          fi
          # Apply 50 patch but immediately revert namespace.c to stock (mount features disabled via susfs-minimal.cfg)
          patch -p1 --fuzz=3 < 50_susfs.patch || true
          git checkout -- fs/namespace.c || true
          rm -f fs/namespace.c.rej
          if git status --porcelain | grep -i '\.rej'; then echo "SUSFS rejects remain (non-namespace):"; git status --porcelain | grep -i rej; git diff --stat | head -n 30; fi
          echo "KSUN v3.2 + SUSFS minimal integrated (namespace reverted)"

      - name: Build m31 gaming
        working-directory: kernel
        run: |
          export PATH="$PWD/toolchain/bin:$PATH"
          OUT="$PWD/out"
          rm -rf "$OUT"; mkdir -p "$OUT"
          JOBS=$(nproc)
          MAKE_BASE="make O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar OBJDUMP=llvm-objdump READELF=llvm-readelf NM=llvm-nm OBJCOPY=llvm-objcopy -j$JOBS"
          $MAKE_BASE exynos9611-m31_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config ../gaming.cfg
          ./scripts/kconfig/merge_config.sh -m -O out out/.config ../susfs-minimal.cfg
          make -C out ARCH=arm64 olddefconfig
          ./scripts/config --file out/.config -e KSU -e KSU_SUSFS -e KPROBES -e TCP_CONG_BBR -e WIREGUARD -e ZRAM || true
          ./scripts/config --file out/.config -d KSU_SUSFS_SUS_MOUNT -d KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -d KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT -d KSU_SUSFS_TRY_UMOUNT -d KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT || true
          make -C out ARCH=arm64 olddefconfig
          grep -E "CONFIG_KSU|CONFIG_TCP_CONG|CONFIG_WIREGUARD|CONFIG_ZRAM" out/.config || true
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("include/linux/cred.h")
          t = p.read_text()
          if "get_cred_rcu" not in t:
              old = "static inline void put_cred"
              new = ("static inline const struct cred *get_cred_rcu(const struct cred *cred)\n"
                     "{\n"
                     "\tstruct cred *nonconst_cred = (struct cred *) cred;\n"
                     "\tif (!cred)\n\t\treturn NULL;\n"
                     "\tif (!atomic_long_inc_not_zero(&nonconst_cred->usage))\n\t\treturn NULL;\n"
                     "\tvalidate_creds(cred);\n"
                     "\treturn cred;\n"
                     "}\n\n" + old)
              assert old in t, "put_cred anchor missing"
              p.write_text(t.replace(old, new, 1))
              print("cred.h get_cred_rcu (atomic_long) pre-seeded")
          else:
              print("cred.h already has get_cred_rcu")
          PY
          export KCFLAGS="-O3 -pipe -fno-plt -fno-addrsig"
          $MAKE_BASE KCFLAGS="$KCFLAGS"
          python3 build_kernel/bin/mkdtboimg.py cfg_create out/arch/arm64/boot/dtbo-m31.img build_kernel/configs/dtbo/m31.cfg -d out/arch/arm64/boot/dts/samsung
          python3 build_kernel/bin/mkdtboimg.py cfg_create out/arch/arm64/boot/exynos9611.dtb build_kernel/configs/dtb/exynos9611.cfg --dtb-dir out/arch/arm64/boot/dts/exynos
          cp -v out/arch/arm64/boot/Image AnyKernel3/Image
          cp -v out/arch/arm64/boot/dtbo-m31.img AnyKernel3/dtbo.img
          cp -v out/arch/arm64/boot/exynos9611.dtb AnyKernel3/dtb
          DATE=$(date +%Y-%m-%d)
          ZIP="XT-Everest_m31_${DATE}.zip"
          sed -i 's/kernel.string=.*/kernel.string=XT-Everest by XtrComSu/' AnyKernel3/anykernel.sh || true
          grep kernel.string AnyKernel3/anykernel.sh || true
          (cd AnyKernel3 && zip -r9 "../$ZIP" Image dtbo.img dtb META-INF tools anykernel.sh version)
          rm -f AnyKernel3/Image AnyKernel3/dtbo.img AnyKernel3/dtb
          ls -lh *.zip
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: XT-Everest-m31
          path: kernel/*.zip
