name: Build m31 Gaming KSU-SUSFS

on:
  workflow_dispatch:
  push:
    paths:
      - gaming.cfg
      - integrate-ksu-susfs.sh
      - .github/workflows/build-m31-gaming.yml

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git curl wget python3 python3-pip bc bison flex \
            build-essential clang llvm lld libssl-dev libelf-dev libncurses-dev \
            dwarves cpio rsync unzip zip binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler \
            ccache u-boot-tools

      - name: Clone kernel (shallow, lineage-24.0)
        run: |
          git clone --depth 1 --branch lineage-24.0 https://github.com/Parbindar7/android_kernel_samsung_universal9611 kernel
          git -C kernel rev-parse --short HEAD
          git -C kernel ls-tree --name-only HEAD:arch/arm64/configs | grep 9611

      - name: Toolchain (Proton Clang 13)
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang /tmp/proton
          mkdir -p kernel/toolchain
          cp -a /tmp/proton/bin kernel/toolchain/
          cp -a /tmp/proton/lib kernel/toolchain/ 2>/dev/null || true
          cp -a /tmp/proton/include kernel/toolchain/ 2>/dev/null || true
          kernel/toolchain/bin/clang --version | head -n1

      - name: Integrate KernelSU-Next + SUSFS
        working-directory: kernel
        run: |
          # Official KernelSU (matches simonpunk SUSFS kernel-4.14 base)
          # Pin v0.9.5: last old-layout (KernelSU/kernel/ksu.c) before v1+/v3 GKI refactor
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          ls KernelSU/kernel/ksu.c
          ls -l drivers/kernelsu || true
          # SUSFS kernel-4.14
          rm -rf /tmp/susfs4ksu
          git clone --depth 1 --branch kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          git -C /tmp/susfs4ksu rev-parse --short HEAD
          cp -v /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp -v /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
          mkdir -p include/linux
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp -v /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || cp -v /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/ || true
          SUSFS_PATCH=$(ls /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel*4.14*.patch 2>/dev/null | head -n1 || echo "")
          echo "SUSFS_PATCH=$SUSFS_PATCH"
          cp -v "$SUSFS_PATCH" ./50_susfs.patch
          cd KernelSU; patch -p1 --fuzz=3 < 10_enable_susfs_for_ksu.patch || true; cd ..
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("KernelSU/kernel/selinux/selinux.c")
          t = p.read_text()
          if "susfs_set_zygote_sid" not in t:
              block = '''
          #ifdef CONFIG_KSU_SUSFS
          static inline void susfs_set_sid(const char *secctx_name, u32 *out_sid)
          {
          \tint err;
          \tif (!secctx_name || !out_sid) { pr_err("secctx_name || out_sid is NULL\\n"); return; }
          \terr = security_secctx_to_secid(secctx_name, strlen(secctx_name), out_sid);
          \tif (err) { pr_err("failed setting sid for '%s', err: %d\\n", secctx_name, err); return; }
          \tpr_info("sid '%u' is set for secctx_name '%s'\\n", *out_sid, secctx_name);
          }
          bool susfs_is_sid_equal(void *sec, u32 sid2) {
          \tstruct task_security_struct *tsec = (struct task_security_struct *)sec;
          \tif (!tsec) return false;
          \treturn tsec->sid == sid2;
          }
          u32 susfs_get_sid_from_name(const char *secctx_name)
          {
          \tu32 out_sid = 0;
          \tif (!secctx_name) return 0;
          \tif (security_secctx_to_secid(secctx_name, strlen(secctx_name), &out_sid)) return 0;
          \treturn out_sid;
          }
          u32 susfs_get_current_sid(void) { return current_sid(); }
          void susfs_set_zygote_sid(void) { susfs_set_sid(KERNEL_ZYGOTE_DOMAIN, &susfs_zygote_sid); }
          bool susfs_is_current_zygote_domain(void) { return unlikely(current_sid() == susfs_zygote_sid); }
          void susfs_set_ksu_sid(void) { susfs_set_sid(KERNEL_SU_DOMAIN, &susfs_ksu_sid); }
          bool susfs_is_current_ksu_domain(void) { return unlikely(current_sid() == susfs_ksu_sid); }
          void susfs_set_init_sid(void) { susfs_set_sid(KERNEL_INIT_DOMAIN, &susfs_init_sid); }
          bool susfs_is_current_init_domain(void) { return unlikely(current_sid() == susfs_init_sid); }
          #endif
          '''
              t = t.replace('#define DEVPTS_DOMAIN', block + '\n#define DEVPTS_DOMAIN', 1)
              p.write_text(t)
              print("selinux.c SUSFS fixup applied")
          else:
              print("selinux.c already has SUSFS helpers")
          PY
          patch -p1 --fuzz=3 < 50_susfs.patch || true
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("fs/namespace.c")
          t = p.read_text()
          if "susfs_mnt_id_ida" not in t:
              # Hunk 1 from 50_add_susfs_in_kernel-4.14.patch failed to apply due to Samsung's extra includes
              # Insert the full SUSFS namespace header + definitions block after the last #include
              # Mirrors the patch's @@ -27,10 +27,39 @@ block
              susfs_block = """#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)
          #include <linux/susfs_def.h>
          #endif

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern bool susfs_is_current_zygote_domain(void);

          static DEFINE_IDA(susfs_mnt_id_ida);
          static DEFINE_IDA(susfs_mnt_group_ida);
          static int susfs_mnt_id_start = DEFAULT_SUS_MNT_ID;
          static int susfs_mnt_group_start = DEFAULT_SUS_MNT_GROUP_ID;

          #define CL_ZYGOTE_COPY_MNT_NS BIT(24) /* used by copy_mnt_ns() */
          #define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */
          #endif

          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          extern void susfs_auto_add_sus_ksu_default_mount(const char __user *to_pathname);
          bool susfs_is_auto_add_sus_ksu_default_mount_enabled = true;
          #endif
          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          extern int susfs_auto_add_sus_bind_mount(const char *pathname, struct path *path_target);
          bool susfs_is_auto_add_sus_bind_mount_enabled = true;
          #endif
          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          extern void susfs_auto_add_try_umount_for_bind_mount(struct path *path);
          bool susfs_is_auto_add_try_umount_for_bind_mount_enabled = true;
          #endif
          """
              lines = t.splitlines(True)
              idx = max(i for i, l in enumerate(lines) if l.startswith("#include"))
              lines.insert(idx+1, susfs_block + "\n")
              p.write_text("".join(lines))
              print("namespace.c SUSFS definitions fixup applied (full hunk 1)")
          else:
              print("namespace.c already has SUSFS definitions")
          PY
          rm -f fs/namespace.c.rej
          if git status --porcelain | grep -i '\.rej'; then echo "SUSFS rejects remain:"; git status --porcelain | grep -i rej; exit 1; fi
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("KernelSU/kernel/core_hook.c")
          t = p.read_text()
          anchor = "static inline void susfs_on_post_fs_data(void) {"
          fi = t.find(anchor)
          old = "\tstruct path path;"
          fj = t.find(old, fi) if fi != -1 else -1
          if fi != -1 and fj != -1 and "(void)path;" not in t[fi:fj+200]:
              t = t[:fj] + old + "\n\t(void)path; /* silence -Wunused when SUS_MOUNT/AUTO_ADD off */" + t[fj+len(old):]
              p.write_text(t)
              print("core_hook.c unused-path fixup applied")
          else:
              print("core_hook.c already fine")
          PY

      - name: Manual KSU hooks
        run: |
          echo "Skipping manual hooks for official KSU v0.9.5 (kprobe/LSM mode) - SUSFS already handles needed hooks"

      - name: Build m31 gaming
        working-directory: kernel
        run: |
          export PATH="$PWD/toolchain/bin:$PATH"
          OUT="$PWD/out"
          rm -rf "$OUT"; mkdir -p "$OUT"
          JOBS=$(nproc)
          MAKE_BASE="make O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar OBJDUMP=llvm-objdump READELF=llvm-readelf NM=llvm-nm OBJCOPY=llvm-objcopy -j$JOBS"
          $MAKE_BASE exynos9611-m31_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config ../gaming.cfg
          make -C out ARCH=arm64 olddefconfig
          ./scripts/config --file out/.config -e KSU -e KSU_SUSFS -e KPROBES -e TCP_CONG_BBR -e WIREGUARD -e ZRAM || true
          make -C out ARCH=arm64 olddefconfig
          grep -E "CONFIG_KSU|CONFIG_TCP_CONG|CONFIG_WIREGUARD|CONFIG_ZRAM" out/.config || true
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("include/linux/cred.h")
          t = p.read_text()
          if "get_cred_rcu" not in t:
              old = "static inline void put_cred"
              new = ("static inline const struct cred *get_cred_rcu(const struct cred *cred)\n"
                     "{\n"
                     "\tstruct cred *nonconst_cred = (struct cred *) cred;\n"
                     "\tif (!cred)\n\t\treturn NULL;\n"
                     "\tif (!atomic_long_inc_not_zero(&nonconst_cred->usage))\n\t\treturn NULL;\n"
                     "\tvalidate_creds(cred);\n"
                     "\treturn cred;\n"
                     "}\n\n" + old)
              assert old in t, "put_cred anchor missing"
              p.write_text(t.replace(old, new, 1))
              print("cred.h get_cred_rcu (atomic_long) pre-seeded, Makefile auto-inject will skip")
          else:
              print("cred.h already has get_cred_rcu")
          PY
          export KCFLAGS="-O3 -pipe -fno-plt -fno-addrsig"
          $MAKE_BASE KCFLAGS="$KCFLAGS"
          python3 build_kernel/bin/mkdtboimg.py cfg_create out/arch/arm64/boot/dtbo-m31.img build_kernel/configs/dtbo/m31.cfg -d out/arch/arm64/boot/dts/samsung
          python3 build_kernel/bin/mkdtboimg.py cfg_create out/arch/arm64/boot/exynos9611.dtb build_kernel/configs/dtb/exynos9611.cfg --dtb-dir out/arch/arm64/boot/dts/exynos
          cp -v out/arch/arm64/boot/Image AnyKernel3/Image
          cp -v out/arch/arm64/boot/dtbo-m31.img AnyKernel3/dtbo.img
          cp -v out/arch/arm64/boot/exynos9611.dtb AnyKernel3/dtb
          DATE=$(date +%Y-%m-%d)
          ZIP="XT-Everest_m31_${DATE}.zip"
          sed -i 's/kernel.string=.*/kernel.string=XT-Everest by XtrComSu/' AnyKernel3/anykernel.sh || true
          grep kernel.string AnyKernel3/anykernel.sh || true
          (cd AnyKernel3 && zip -r9 "../$ZIP" Image dtbo.img dtb META-INF tools anykernel.sh version)
          rm -f AnyKernel3/Image AnyKernel3/dtbo.img AnyKernel3/dtb
          ls -lh *.zip
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: XT-Everest-m31
          path: kernel/*.zip
